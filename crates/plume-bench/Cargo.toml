[package]
name = "plume-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
plume-core = { workspace = true }
plume-exec = { workspace = true }
plume-optimizer = { workspace = true }
plume-io = { workspace = true }
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
parquet = { workspace = true }
duckdb = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }

[[bin]]
name = "gen_fixtures"
path = "src/bin/gen_fixtures.rs"

[[bin]]
name = "prepare_datasets"
path = "src/bin/prepare_datasets.rs"

[[bench]]
name = "queries"
harness = false
